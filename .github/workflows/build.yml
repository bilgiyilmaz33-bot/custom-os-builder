name: Alp OS Gamer Edition - Final Build

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Ortami Hazirla
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools binutils libisoburn1

      - name: Isletim Sistemi Kurulumu
        run: |
          mkdir -p iso_root/live chroot
          sudo debootstrap --arch=amd64 focal chroot http://archive.ubuntu.com/ubuntu/
          sudo mount --bind /dev chroot/dev
          sudo mount --bind /run chroot/run
          sudo mount -t proc proc chroot/proc
          sudo mount -t sysfs sysfs chroot/sys
          
          # HATA ÖNLEYİCİ: git ve tüm bağımlılıkları en başta garantiye alıyoruz
          sudo chroot chroot apt-get update
          sudo chroot chroot apt-get install -y linux-image-generic live-boot git wine64 wine-stable xfce4 xfce4-goodies fonts-roboto

      - name: Gamer Temasi ve EXE Desteği
        run: |
          # Temayi git ile güvenli cek
          sudo chroot chroot git clone https://github.com/B00merang-Project/Windows-10.git /usr/share/themes/Windows-10
          # EXE dosyalari icin Wine tetikleyiciyi dizine ekle
          echo -e '#!/bin/bash\nwine "$@"' | sudo tee chroot/usr/local/bin/run-exe
          sudo chmod +x chroot/usr/local/bin/run-exe

      - name: Sistemi Paketle
        run: |
          sudo umount chroot/proc chroot/sys chroot/dev chroot/run
          sudo mksquashfs chroot iso_root/live/filesystem.squashfs -comp xz -b 1M
          mkdir -p iso_root/boot/grub
          cp chroot/boot/vmlinuz-* iso_root/boot/vmlinuz || true
          cp chroot/boot/initrd.img-* iso_root/boot/initrd.img || true

      - name: ISO Derle
        run: |
          echo 'menuentry "Alp OS Gamer" { linux /boot/vmlinuz boot=live components quiet splash; initrd /boot/initrd.img }' | sudo tee iso_root/boot/grub/grub.cfg
          sudo grub-mkrescue -o AlpOS_Final.iso iso_root

      - name: ISO'yu Yukle
        uses: actions/upload-artifact@v4
        with:
          name: AlpOS-Gamer-Final
          path: AlpOS_Final.iso
