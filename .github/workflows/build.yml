name: Build ISO
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paketle
        run: |
          sudo apt-get update && sudo apt-get install -y xorriso
          xorriso -as mkisofs -o alp.iso iso/
      - uses: actions/upload-artifact@v4
        with:
          name: alp-iso
          path: alp.iso
