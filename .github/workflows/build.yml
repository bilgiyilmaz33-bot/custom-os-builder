name: Ultimate Windows10 Style Gamer OS Builder

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Derleme Yoneticilerini ve Paketleri Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools binutils libisoburn1

      - name: Temel Linux Iskeletini Olustur
        run: |
          mkdir -p iso_root/live
          mkdir -p chroot
          sudo debootstrap --arch=amd64 focal chroot http://archive.ubuntu.com/ubuntu/

      - name: Donanim Sürücüleri ve Ag Paketlerini Yukle
        run: |
          sudo mount --bind /dev chroot/dev
          sudo mount --bind /run chroot/run
          sudo mount -t proc proc chroot/proc
          sudo mount -t sysfs sysfs chroot/sys
          
          echo "deb http://archive.ubuntu.com/ubuntu/ focal main restricted universe multiverse" | sudo tee chroot/etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu/ focal-updates main restricted universe multiverse" | sudo tee -a chroot/etc/apt/sources.list
          echo "deb http://security.ubuntu.com/ubuntu focal-security main restricted universe multiverse" | sudo tee -a chroot/etc/apt/sources.list
          
          sudo chroot chroot apt-get update
          sudo chroot chroot apt-get install -y --no-install-recommends linux-image-generic live-boot initramfs-tools
          sudo chroot chroot apt-get install -y network-manager network-manager-gnome wireless-tools wpasupplicant bluez bluez-tools blueman
          sudo chroot chroot apt-get install -y xfce4 xfce4-goodies xorg lightdm lightdm-gtk-greeter ubiquity ubiquity-frontend-gtk
          sudo chroot chroot apt-get install -y wine64 wine-stable winetricks binfmt-support

      - name: Windows 10 Temasi ve Arka Plan Tasarimi
        run: |
          sudo chroot chroot git clone https://github.com/B00merang-Project/Windows-10.git /usr/share/themes/Windows-10
          sudo chroot chroot git clone https://github.com/B00merang-Project/Windows-10-Icons.git /usr/share/icons/Windows-10
          sudo chroot chroot update-desktop-database
          
          sudo mkdir -p chroot/usr/share/backgrounds/gamer
          sudo wget -O chroot/usr/share/backgrounds/gamer/wallpaper.jpg "https://images.hdqwalls.com/download/windows-10-dark-gaming-4k-mo-1920x1080.jpg"

      - name: EXE Dosya Iliskilerini Yapilandir
        run: |
          sudo mkdir -p chroot/usr/share/applications
          echo "[Desktop Entry]" | sudo tee chroot/usr/share/applications/wine-handler.desktop
          echo "Name=Wine Windows Program Loader" | sudo tee -a chroot/usr/share/applications/wine-handler.desktop
          echo "Exec=wine %f" | sudo tee -a chroot/usr/share/applications/wine-handler.desktop
          echo "Type=Application" | sudo tee -a chroot/usr/share/applications/wine-handler.desktop
          echo "MimeType=application/x-ms-dos-executable;application/x-msdownload;application/exe;" | sudo tee -a chroot/usr/share/applications/wine-handler.desktop
          
          sudo mkdir -p chroot/usr/share/mime/packages
          echo '<?xml version="1.0" encoding="UTF-8"?><mime-info xmlns="http://www.freedesktop.org/standards/shared-mime-info"><mime-type type="application/x-ms-dos-executable"><comment>Windows Executable</comment><glob pattern="*.exe"/></mime-type></mime-info>' | sudo tee chroot/usr/share/mime/packages/exe.xml
          
          sudo chroot chroot update-mime-database /usr/share/mime
          sudo chroot chroot update-desktop-database /usr/share/applications

      - name: Sanal Baglantilari Guvenli Sok
        run: |
          sudo umount chroot/proc
          sudo umount chroot/sys
          sudo umount chroot/dev
          sudo umount chroot/run

      - name: Dosya Sistemini Sıkıstır
        run: |
          sudo mksquashfs chroot iso_root/live/filesystem.squashfs -comp xz -b 1M

      - name: Boot Cekirdegini Hazirla
        run: |
          mkdir -p iso_root/boot
          KERNEL_FILE=$(ls chroot/boot/vmlinuz-* | head -n 1)
          INITRD_FILE=$(ls chroot/boot/initrd.img-* | head -n 1)
          sudo cp "$KERNEL_FILE" iso_root/boot/vmlinuz
          sudo cp "$INITRD_FILE" iso_root/boot/initrd.img

      - name: GRUB Menu Ayarlarini Yazdir
        run: |
          mkdir -p iso_root/boot/grub
          echo "set timeout=5" | sudo tee iso_root/boot/grub/grub.cfg
          echo "set default=0" | sudo tee -a iso_root/boot/grub/grub.cfg
          echo "insmod env" | sudo tee -a iso_root/boot/grub/grub.cfg
          echo "insmod all_video" | sudo tee -a iso_root/boot/grub/grub.cfg
          echo 'menuentry "Gamer OS (Windows 10 Style) - Kurulum ve Canli Mod" {' | sudo tee -a iso_root/boot/grub/grub.cfg
          echo '    search --set=root --file /live/filesystem.squashfs' | sudo tee -a iso_root/boot/grub/grub.cfg
          echo '    linux /boot/vmlinuz boot=live oem-config/enable=true components quiet splash' | sudo tee -a iso_root/boot/grub/grub.cfg
          echo '    initrd /boot/initrd.img' | sudo tee -a iso_root/boot/grub/grub.cfg
          echo '}' | sudo tee -a iso_root/boot/grub/grub.cfg

      - name: Hibrit ISO Kalibini Derle
        run: |
          sudo grub-mkrescue -o custom-gamer-os.iso iso_root

      - name: ISO Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Windows10-Gamer-OS-ISO
          path: custom-gamer-os.iso
