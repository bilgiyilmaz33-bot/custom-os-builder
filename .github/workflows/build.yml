name: Alpment OS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoları Güncelle
        run: sudo apt-get update && sudo apt-get install -y xorriso isolinux squashfs-tools

      - name: İşletim Sistemi Hazırlığı
        run: |
          mkdir -p iso_root/boot/grub
          echo "Alpment OS - Başlangıç" > iso_root/README.txt
          # Buraya kendi dosyalarını ekleyebilirsin
      
      - name: ISO Oluştur
        run: |
          xorriso -as mkisofs -o AlpmentOS.iso -isohybrid-mbr /usr/lib/SYSLINUX/isohdpfx.bin -c isolinux/boot.cat -b isolinux/isolinux.bin -no-emul-boot -boot-load-size 4 -boot-info-table iso_root

      - name: Çıktıyı Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: AlpmentOS-ISO
          path: AlpmentOS.iso
