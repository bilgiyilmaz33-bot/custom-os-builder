name: Alpment OS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Gerekli Paketleri Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso syslinux isolinux

      - name: Klasör Yapısını Hazırla
        run: |
          mkdir -p iso_root/isolinux

      - name: Boot Dosyalarını Doğru Konumlardan Kopyala
        run: |
          # Ubuntu üzerindeki güncel isolinux ve syslinux dosyalarını kopyalıyoruz
          cp /usr/lib/ISOLINUX/isolinux.bin iso_root/isolinux/
          cp /usr/lib/syslinux/modules/bios/ldlinux.c32 iso_root/isolinux/

      - name: Eksiksiz Isolinux Yapılandırması Oluştur
        run: |
          cat << 'EOF' > iso_root/isolinux/isolinux.cfg
          default alpment
          prompt 1
          timeout 50

          label alpment
            localboot 0x80
          EOF

      - name: Karşılama Metni Ekle
        run: |
          echo "=======================================" > iso_root/AlpmentOS.txt
          echo " Alpment OS Dunyasina Hos Geldiniz!    " >> iso_root/AlpmentOS.txt
          echo "=======================================" >> iso_root/AlpmentOS.txt

      - name: ISO Dosyasını Sıkıştır ve Derle
        run: |
          xorriso -as mkisofs \
            -o AlpmentOS.iso \
            -b isolinux/isolinux.bin \
            -c isolinux/boot.cat \
            -no-emul-boot \
            -boot-load-size 4 \
            -boot-info-table \
            iso_root

      - name: ISO Dosyasını Artifact Olarak Çıkart
        uses: actions/upload-artifact@v4
        with:
          name: AlpmentOS-ISO
          path: AlpmentOS.iso
